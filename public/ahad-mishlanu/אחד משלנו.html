<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<title>אחד משלנו — פורטל עסקי</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="ds.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
body { background: #f7f8fa; }
.page-shell { min-height: 100vh; display: flex; flex-direction: column; }

/* ── HEADER ── */
.site-header {
  background: var(--navy); height: var(--header-h);
  position: sticky; top: 0; z-index: 100;
  border-bottom: 3px solid var(--yellow);
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
}
.promo-bar {
  background: var(--yellow); padding: 6px 0;
  font-size: 13px; font-weight: 600; color: var(--gray-800);
  text-align: center; overflow: hidden;
}
.promo-bar a { color: var(--navy); text-decoration: underline; margin-right: 8px; }

/* search */
.search-wrap { display: flex; height: 40px; border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); }
.search-input { flex: 1; border: none; padding: 0 14px; font-family: var(--font); font-size: 14px; outline: none; color: var(--gray-800); min-width: 0; }
.search-region { border-right: 1.5px solid var(--gray-100); padding: 0 12px; background: var(--white); font-size: 13px; color: var(--gray-600); display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
.search-btn { background: var(--yellow); color: var(--gray-800); padding: 0 18px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 4px; }
.search-btn:hover { background: var(--yellow-dark); color: var(--white); }

/* subnav */
.subnav {
  background: var(--navy-mid); height: var(--subnav-h);
  border-bottom: 1px solid var(--navy-light);
  overflow-x: auto;
}
.subnav-inner { display: flex; align-items: stretch; height: 100%; white-space: nowrap; }
.subnav-item { padding: 0 16px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.75); display: flex; align-items: center; cursor: pointer; border-left: 1px solid rgba(255,255,255,.08); transition: color .15s, background .15s; }
.subnav-item:hover, .subnav-item.active { color: var(--yellow); background: rgba(255,255,255,.05); }
.subnav-item:first-child { font-weight: 700; color: var(--white); }

/* ── HERO ── */
.hero { background: linear-gradient(140deg, var(--navy-dark) 0%, var(--navy) 60%, #1e4d8a 100%); padding: 52px 0 44px; text-align: center; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, rgba(249,228,74,.08) 0%, transparent 60%); pointer-events: none; }
.hero-title { font-size: 38px; font-weight: 800; color: var(--yellow); margin-bottom: 8px; line-height: 1.15; }
.hero-sub   { font-size: 17px; color: rgba(255,255,255,.8); margin-bottom: 28px; }
.hero-tags  { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.hero-tag   { padding: 5px 14px; border-radius: var(--r-full); font-size: 13px; font-weight: 500; background: rgba(255,255,255,.1); color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.2); cursor: pointer; transition: all .15s; }
.hero-tag:hover { background: var(--yellow); color: var(--gray-800); border-color: var(--yellow); }

/* ── CATEGORY ICONS ── */
.cat-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 12px; min-width: 90px; border-radius: var(--r-lg); cursor: pointer; transition: all .18s; border: 1.5px solid var(--gray-100); background: var(--white); }
.cat-item:hover { border-color: var(--navy); background: var(--gray-50); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.cat-icon { width: 52px; height: 44px; background: var(--gray-50); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.cat-label { font-size: 12px; font-weight: 500; color: var(--gray-600); text-align: center; line-height: 1.2; }
.cat-item.active .cat-icon { background: var(--navy); }
.cat-item.active .cat-label { color: var(--navy); font-weight: 700; }

/* ── CAROUSEL ── */
.carousel-wrap { overflow-x: auto; padding-bottom: 8px; display: flex; gap: 14px; }
.carousel-wrap::-webkit-scrollbar { height: 4px; }

/* ── BUSINESS CARD ── */
.biz-card { width: 200px; flex-shrink: 0; border-radius: var(--r-lg); border: 1.5px solid var(--gray-100); background: var(--white); overflow: hidden; transition: all .18s; cursor: pointer; }
.biz-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--gray-200); }
.biz-card-img { width: 100%; height: 110px; background: var(--gray-100); display: flex; align-items: center; justify-content: center; color: var(--gray-400); font-size: 13px; position: relative; overflow: hidden; }
.biz-card-img::before, .biz-card-img::after { content: ''; position: absolute; width: 130%; height: 1.5px; background: var(--gray-200); left: -15%; }
.biz-card-img::before { transform: rotate(15deg); }
.biz-card-img::after  { transform: rotate(-15deg); }
.biz-card-body { padding: 12px; }
.biz-card-name { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.biz-card-kin  { font-size: 12px; color: var(--orange); margin-bottom: 6px; }
.biz-card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.biz-card-ctas { display: flex; gap: 6px; }

/* ── SECTION HEADER ── */
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sec-title   { font-size: 20px; font-weight: 700; color: var(--gray-800); }
.sec-link    { font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer; }
.sec-link:hover { text-decoration: underline; }

/* ── SEASONAL STRIP ── */
.seasonal { background: var(--yellow-light); border-top: 2px solid var(--yellow); border-bottom: 2px solid var(--yellow); padding: 10px 0; }

/* ── HOLISTIC STRIP ── */
.holistic-strip { background: linear-gradient(135deg, var(--navy-dark), var(--navy)); padding: 48px 0; }
.hol-card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: var(--r-lg); padding: 24px; text-align: center; transition: all .2s; cursor: pointer; }
.hol-card:hover { background: rgba(255,255,255,.12); transform: translateY(-3px); }
.hol-icon { font-size: 36px; margin-bottom: 12px; }
.hol-title { font-size: 16px; font-weight: 700; color: var(--yellow); margin-bottom: 6px; }
.hol-sub   { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.5; }

/* ── QUALITY SEAL ── */
.seal-strip { background: var(--white); padding: 40px 0; border-top: 1px solid var(--gray-100); border-bottom: 1px solid var(--gray-100); }
.seal-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.seal-icon { width: 56px; height: 56px; border-radius: var(--r-full); background: var(--green-light); display: flex; align-items: center; justify-content: center; font-size: 26px; }

/* ── LEAD FORM ── */
.lead-form-wrap { background: var(--gray-50); padding: 48px 0; }
.lead-form { background: var(--white); border-radius: var(--r-xl); padding: 36px; box-shadow: var(--shadow-md); max-width: 560px; margin: 0 auto; }

/* ── FOOTER ── */
.footer { background: var(--navy-dark); padding: 40px 0 20px; border-top: 3px solid var(--yellow); }
.footer-logo { margin-bottom: 10px; }
.footer-tagline { font-size: 13px; color: rgba(255,255,255,.5); }
.footer-col-title { font-size: 13px; font-weight: 700; color: var(--yellow); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
.footer-link { font-size: 13px; color: rgba(255,255,255,.6); display: block; margin-bottom: 6px; cursor: pointer; transition: color .15s; }
.footer-link:hover { color: var(--yellow); }
.footer-bottom { border-top: 1px solid rgba(255,255,255,.08); margin-top: 24px; padding-top: 16px; font-size: 12px; color: rgba(255,255,255,.35); text-align: center; }

/* ── CATEGORY PAGE ── */
.cat-page { display: flex; gap: 24px; padding: 24px 0; }
.sidebar { width: 220px; flex-shrink: 0; }
.sidebar-box { background: var(--white); border-radius: var(--r-lg); border: 1.5px solid var(--gray-100); padding: 16px; margin-bottom: 14px; }
.sidebar-title { font-size: 14px; font-weight: 700; color: var(--gray-800); margin-bottom: 12px; }
.sidebar-item { font-size: 13px; padding: 6px 0; cursor: pointer; border-bottom: 1px solid var(--gray-100); color: var(--gray-600); transition: color .12s; display: flex; align-items: center; justify-content: space-between; }
.sidebar-item:hover { color: var(--navy); }
.sidebar-item.active { color: var(--navy); font-weight: 700; }
.filter-check { width: 16px; height: 16px; border: 1.5px solid var(--gray-200); border-radius: 3px; flex-shrink: 0; background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.filter-check.checked { background: var(--navy); border-color: var(--navy); }
.results-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }

/* ── PROFILE PAGE ── */
.profile-hero { background: linear-gradient(120deg, var(--navy-dark), var(--navy)); padding: 36px 0; }
.profile-avatar { width: 100px; height: 100px; border-radius: var(--r-full); background: var(--gray-200); border: 4px solid var(--yellow); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--gray-400); overflow: hidden; }
.service-item { border: 1.5px solid var(--gray-100); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 10px; transition: box-shadow .15s; }
.service-item:hover { box-shadow: var(--shadow-sm); }
.service-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; background: var(--white); }
.service-header:hover { background: var(--gray-50); }
.service-body { padding: 16px; background: var(--gray-50); border-top: 1px solid var(--gray-100); }
.service-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.service-meta-box { background: var(--white); border-radius: var(--r-md); padding: 12px; border: 1px solid var(--gray-100); }
.service-meta-title { font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }

/* ── ITEM PAGE ── */
.item-gallery { display: flex; gap: 8px; }
.item-main-img { flex: 1; height: 320px; border-radius: var(--r-lg); background: var(--gray-100); display: flex; align-items: center; justify-content: center; color: var(--gray-400); font-size: 14px; position: relative; overflow: hidden; }
.item-main-img::before, .item-main-img::after { content: ''; position: absolute; width: 130%; height: 1.5px; background: var(--gray-200); left: -15%; }
.item-main-img::before { transform: rotate(12deg); }
.item-main-img::after  { transform: rotate(-12deg); }
.item-thumb { width: 70px; height: 60px; border-radius: var(--r-md); background: var(--gray-100); border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--gray-400); font-size: 11px; overflow: hidden; position: relative; }
.item-thumb.active { border-color: var(--navy); }
.item-thumb::before, .item-thumb::after { content: ''; position: absolute; width: 130%; height: 1.5px; background: var(--gray-200); left: -15%; }
.item-thumb::before { transform: rotate(15deg); }
.item-thumb::after  { transform: rotate(-15deg); }
.item-thumbs { display: flex; flex-direction: column; gap: 6px; }
.variant-btn { padding: 8px 16px; border-radius: var(--r-md); border: 1.5px solid var(--gray-200); background: var(--white); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
.variant-btn:hover, .variant-btn.active { border-color: var(--navy); background: var(--navy); color: var(--white); }

/* ── CONTACT PAGE ── */
.contact-info-box { background: var(--navy); border-radius: var(--r-xl); padding: 28px; color: var(--white); }
.contact-info-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.contact-info-icon { width: 40px; height: 40px; border-radius: var(--r-md); background: rgba(249,228,74,.15); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.faq-item { border-bottom: 1px solid var(--gray-100); padding: 14px 0; cursor: pointer; }
.faq-q { font-size: 15px; font-weight: 600; color: var(--gray-800); display: flex; justify-content: space-between; align-items: center; }
.faq-a { font-size: 14px; color: var(--gray-600); margin-top: 8px; line-height: 1.6; }

/* ── HOLISTIC PAGE ── */
.hol-page-hero { background: linear-gradient(140deg, var(--navy-dark), var(--navy) 60%, #1e4d8a); padding: 64px 0; text-align: center; }
.hol-package { background: var(--white); border-radius: var(--r-xl); border: 2px solid var(--gray-100); padding: 28px; transition: all .2s; cursor: pointer; }
.hol-package:hover { border-color: var(--navy); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.hol-package.featured { border-color: var(--yellow); background: linear-gradient(135deg, #fffdf0, var(--white)); }
.hol-pack-icon { font-size: 40px; margin-bottom: 14px; }
.hol-pack-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.hol-pack-price { font-size: 28px; font-weight: 800; color: var(--navy); margin: 10px 0; }
.hol-pack-list { list-style: none; }
.hol-pack-list li { font-size: 14px; color: var(--gray-600); padding: 5px 0; display: flex; align-items: center; gap: 8px; }
.hol-pack-list li::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; }
.catalog-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.catalog-card { min-width: 180px; flex-shrink: 0; background: var(--white); border-radius: var(--r-lg); border: 1.5px solid var(--gray-100); padding: 16px; text-align: center; transition: all .18s; cursor: pointer; }
.catalog-card:hover { border-color: var(--navy); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.catalog-icon { font-size: 32px; margin-bottom: 8px; }
.catalog-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.catalog-sub   { font-size: 12px; color: var(--gray-600); }

/* ── ADMIN ── */
.admin-shell { display: flex; min-height: 100vh; background: var(--off-white); }
.admin-sidebar { width: 220px; background: var(--navy-dark); flex-shrink: 0; padding: 0; position: fixed; top: 0; bottom: 0; right: 0; z-index: 50; }
.admin-logo-area { padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
.admin-nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; font-size: 14px; color: rgba(255,255,255,.65); cursor: pointer; transition: all .15s; border-right: 3px solid transparent; }
.admin-nav-item:hover { background: rgba(255,255,255,.06); color: var(--white); }
.admin-nav-item.active { background: rgba(249,228,74,.08); color: var(--yellow); border-right-color: var(--yellow); font-weight: 600; }
.admin-nav-section { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: 1px; padding: 14px 16px 4px; }
.admin-main { margin-right: 220px; padding: 24px; flex: 1; }
.admin-topbar { background: var(--white); border-radius: var(--r-lg); padding: 14px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
.stat-card { background: var(--white); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-sm); border: 1.5px solid var(--gray-100); }
.stat-num  { font-size: 32px; font-weight: 800; color: var(--navy); }
.stat-label { font-size: 13px; color: var(--gray-600); margin-top: 2px; }
.data-table { background: var(--white); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.table-header { background: var(--gray-50); border-bottom: 1px solid var(--gray-100); }
.table-row { border-bottom: 1px solid var(--gray-100); transition: background .12s; }
.table-row:hover { background: var(--gray-50); }
th, td { padding: 11px 14px; font-size: 13px; text-align: right; }
th { font-weight: 700; color: var(--gray-600); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }

/* ── TAB NAV (for page switcher) ── */
.page-nav { background: var(--gray-800); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
.page-nav-tabs { display: flex; gap: 4px; overflow-x: auto; }
.pn-tab { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: var(--r-md); cursor: pointer; border: 1.5px solid transparent; white-space: nowrap; transition: all .15s; color: rgba(255,255,255,.55); }
.pn-tab.active { background: var(--yellow); color: var(--gray-800); border-color: var(--yellow-dark); }
.pn-tab:hover:not(.active) { background: rgba(255,255,255,.08); color: var(--white); }
.pn-var { font-size: 11px; padding: 5px 10px; border-radius: var(--r-md); cursor: pointer; border: 1.5px solid; white-space: nowrap; }
.pn-var.v1 { border-color: rgba(249,228,74,.4); color: var(--yellow); }
.pn-var.v1.active { background: var(--yellow); color: var(--gray-800); }
.pn-var.v2 { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.6); }
.pn-var.v2.active { background: rgba(255,255,255,.15); color: var(--white); }

/* ── PLACEHOLDER img ── */
.ph { background: var(--gray-100); display: flex; align-items: center; justify-content: center; color: var(--gray-400); font-size: 13px; position: relative; overflow: hidden; }
.ph::before, .ph::after { content: ''; position: absolute; width: 130%; height: 1.5px; background: var(--gray-200); left: -15%; }
.ph::before { transform: rotate(12deg); }
.ph::after  { transform: rotate(-12deg); }
.ph span { position: relative; z-index: 1; background: var(--gray-100); padding: 2px 6px; border-radius: 3px; }

/* V2 overrides */
.v2 .hero { background: linear-gradient(160deg, #0a1628 0%, var(--navy) 100%); }
.v2 .hero-title { color: var(--white); }
.v2 .hero-title span { color: var(--yellow); }
.v2 .site-header { background: var(--white); border-bottom: 2px solid var(--gray-100); box-shadow: var(--shadow-sm); }
.v2 .subnav { background: var(--gray-50); border-bottom: 1px solid var(--gray-100); }
.v2 .subnav-item { color: var(--gray-600); border-left-color: var(--gray-100); }
.v2 .subnav-item:hover, .v2 .subnav-item.active { color: var(--navy); background: var(--gray-50); }

/* line-clamp */
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

/* breadcrumb */
.breadcrumb { font-size: 13px; color: var(--gray-400); display: flex; align-items: center; gap: 6px; padding: 12px 0; }
.breadcrumb a { color: var(--navy); cursor: pointer; }
.breadcrumb span { color: var(--gray-300); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════ */

function LogoSVG({ size = 32, light = true }) {
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="13" r="9" fill={light ? '#F9E44A' : '#1B3F6E'} />
      <circle cx="16" cy="13" r="9" fill="none" stroke={light ? 'rgba(255,255,255,.3)' : 'none'} strokeWidth="1.5" />
      <line x1="11" y1="21" x2="8"  y2="31" stroke={light ? '#fff' : '#1B3F6E'} strokeWidth="3" strokeLinecap="round"/>
      <line x1="21" y1="21" x2="24" y2="31" stroke={light ? '#fff' : '#1B3F6E'} strokeWidth="3" strokeLinecap="round"/>
      <circle cx="16" cy="13" r="4" fill={light ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.5)'} />
    </svg>
  );
}

function Logo({ light = true, size = 'md' }) {
  const sz = size === 'sm' ? 26 : size === 'lg' ? 42 : 32;
  return (
    <div style={{ display:'flex', alignItems:'center', gap: sz * 0.3 }}>
      <LogoSVG size={sz} light={light} />
    </div>
  );
}

function PromoBanner() {
  const msgs = [
    '🆕 12 עסקים חדשים הצטרפו החודש!',
    '🏷️ שבוע הספר — 20% הנחה על תוכן וספרים',
    '🤝 חברות חדשה: קייטרינג "טעמים מהבית" — ת"א',
    '🎉 500+ עסקים רשומים — הצטרפו גם אתם!',
  ];
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI(p => (p + 1) % msgs.length), 3000);
    return () => clearInterval(t);
  }, []);
  return (
    <div className="promo-bar">
      {msgs[i]}
      <a>לפרטים ←</a>
    </div>
  );
}

function SiteHeader({ variant, page, setPage }) {
  const navItems = ['כל הקטגוריות','בית ותשתיות','משפט','ספרים וחינוך','מזון ואירועים','טכנולוגיה','עיצוב','ועדי עובדים'];
  return (
    <>
      <PromoBanner />

        <div className="admin-nav-section">ניהול</div>
        {navItems.map(n=>(
          <div key={n.id} className={`admin-nav-item${adminTab===n.id?' active':''}`} onClick={()=>setAdminTab(n.id)}>
            <span>{n.icon}</span>
            <span>{n.label}</span>
          </div>
        ))}
        <div className="admin-nav-section" style={{ marginTop:20 }}>כללי</div>
        <div className="admin-nav-item" onClick={()=>{}}>🔙 חזרה לאתר</div>
        <div className="admin-nav-item" style={{ marginTop:'auto' }}>🚪 יציאה</div>
      </div>

      {/* Admin Main */}
      <div className="admin-main">
        <div className="admin-topbar">
          <div style={{ fontWeight:700, fontSize:16, color:'var(--gray-800)' }}>
            {navItems.find(n=>n.id===adminTab)?.label || 'ניהול'}
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <span style={{ fontSize:13, color:'var(--gray-600)' }}>שלום, מנהל</span>
            <div style={{ width:34, height:34, borderRadius:'50%', background:'var(--navy)', color:'var(--white)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, fontWeight:700 }}>מ</div>
          </div>
        </div>

        {/* DASHBOARD */}
        {adminTab === 'dashboard' && (
          <div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14, marginBottom:20 }}>
              {[
                { icon:'🏢', num:'524', label:'עסקים רשומים', color:'var(--navy)' },
                { icon:'👤', num:'312', label:'פרופילים אישיים', color:'var(--green)' },
                { icon:'🛒', num:'1,284', label:'הזמנות החודש', color:'var(--orange)' },
                { icon:'🆕', num:'28', label:'הצטרפו השבוע', color:'var(--purple)' },
              ].map(s=>(
                <div key={s.label} className="stat-card">
                  <div style={{ fontSize:26, marginBottom:4 }}>{s.icon}</div>
                  <div className="stat-num" style={{ color:s.color }}>{s.num}</div>
                  <div className="stat-label">{s.label}</div>
                </div>
              ))}
            </div>
            <div className="data-table">
              <div className="table-header"><tr><th>שם עסק</th><th>קטגוריה</th><th>סטטוס</th><th>תאריך</th><th>פעולות</th></tr></div>
              <tbody>
                {['עסק כהן','עסק לוי','עסק מזרחי','עסק פרץ'].map((b,i)=>(
                  <tr key={b} className="table-row">
                    <td style={{ fontWeight:500 }}>{b}</td>
                    <td><span className="tag tag-blue">חשמלאים</span></td>
                    <td><span className={`tag ${i===2?'tag-orange':'tag-green'}`}>{i===2?'ממתין לאימות':'מאומת'}</span></td>
                    <td style={{ color:'var(--gray-600)' }}>01/05/2024</td>
                    <td><button className="btn btn-ghost btn-sm">ערוך</button></td>
                  </tr>
                ))}
              </tbody>
            </div>
          </div>
        )}

        {/* CATEGORIES */}
        {adminTab === 'categories' && (
          <div>
            <div style={{ background:'var(--white)', borderRadius:'var(--r-lg)', padding:20, marginBottom:16, boxShadow:'var(--shadow-sm)' }}>
              <div style={{ fontWeight:700, fontSize:15, marginBottom:14 }}>+ הוסף קטגוריה חדשה</div>
              <div style={{ display:'flex', gap:10 }}>
                <input className="input" placeholder="שם הקטגוריה" value={newCat} onChange={e=>setNewCat(e.target.value)} style={{ flex:1 }} />
                <button className="btn btn-primary" onClick={()=>{
                  if(newCat.trim()) { setCats(p=>[...p,{id:Date.now(),name:newCat.trim(),subs:0,active:true}]); setNewCat(''); }
                }}>הוסף</button>
              </div>
            </div>
            <div className="data-table">
              <table style={{ width:'100%', borderCollapse:'collapse' }}>
                <thead className="table-header">
                  <tr><th>שם קטגוריה</th><th>תת-קטגוריות</th><th>סטטוס</th><th>פעולות</th></tr>
                </thead>
                <tbody>
                  {cats.map(c=>(
                    <tr key={c.id} className="table-row">
                      <td>
                        {editId===c.id ? (
                          <input className="input" defaultValue={c.name} onBlur={e=>{
                            setCats(p=>p.map(x=>x.id===c.id?{...x,name:e.target.value}:x));
                            setEditId(null);
                          }} autoFocus style={{ width:'auto', padding:'4px 8px', fontSize:13 }} />
                        ) : (
                          <span style={{ fontWeight:500 }}>{c.name}</span>
                        )}
                      </td>
                      <td><span className="tag tag-blue">{c.subs} תת-קטגוריות</span></td>
                      <td>
                        <button onClick={()=>setCats(p=>p.map(x=>x.id===c.id?{...x,active:!x.active}:x))}
                          className={`tag ${c.active?'tag-green':'tag-orange'}`} style={{ cursor:'pointer', border:'none', font:'inherit' }}>
                          {c.active?'✅ פעיל':'⏸️ מושהה'}
                        </button>
                      </td>
                      <td style={{ display:'flex', gap:6 }}>
                        <button className="btn btn-ghost btn-sm" onClick={()=>setEditId(c.id)}>✏️ ערוך</button>
                        <button className="btn btn-ghost btn-sm" style={{ color:'var(--red)', borderColor:'var(--red)' }}
                          onClick={()=>setCats(p=>p.filter(x=>x.id!==c.id))}>🗑️ מחק</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* OTHER TABS */}
        {!['dashboard','categories'].includes(adminTab) && (
          <div style={{ background:'var(--white)', borderRadius:'var(--r-xl)', padding:32, textAlign:'center', boxShadow:'var(--shadow-sm)' }}>
            <div style={{ fontSize:40, marginBottom:14 }}>{navItems.find(n=>n.id===adminTab)?.icon}</div>
            <div style={{ fontSize:18, fontWeight:700, color:'var(--gray-800)', marginBottom:6 }}>
              {navItems.find(n=>n.id===adminTab)?.label}
            </div>
            <div style={{ fontSize:14, color:'var(--gray-600)' }}>מסך זה יפותח בגרסה הבאה</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   ROOT APP
═══════════════════════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "v1",
  "primaryColor": "#1B3F6E",
  "accentColor": "#F9E44A"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweakState] = useState(TWEAK_DEFAULTS);
  const setTweak = (key, val) => setTweakState(p => ({ ...p, [key]: val }));
  const [page, setPage] = useState('home');
  const variant = tweaks.variant;

  const pages = [
    { id:'home',      label:'דף הבית' },
    { id:'category',  label:'קטגוריה' },
    { id:'profile',   label:'פרופיל אישי' },
    { id:'item',      label:'מוצר/שירות' },
    { id:'contact',   label:'צור קשר' },
    { id:'holistic',  label:'לעסקים' },
    { id:'admin',     label:'⚙️ ניהול' },
  ];

  useEffect(() => {
    document.documentElement.style.setProperty('--navy', tweaks.primaryColor);
    document.documentElement.style.setProperty('--yellow', tweaks.accentColor);
  }, [tweaks.primaryColor, tweaks.accentColor]);

  const isAdmin = page === 'admin';

  return (
    <div className={`page-shell ${variant}`} dir="rtl">
      {/* Page switcher nav */}
      <div className="page-nav">
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <Logo light size="sm" />
          <span style={{ fontSize:12, color:'rgba(255,255,255,.4)' }}>Hi-Fi Design</span>
        </div>
        <div className="page-nav-tabs">
          {pages.map(p=>(
            <button key={p.id} onClick={()=>setPage(p.id)}
              className={`pn-tab${page===p.id?' active':''}`}>{p.label}</button>
          ))}
        </div>
        <div style={{ display:'flex', gap:4 }}>
          <button onClick={()=>setTweak('variant','v1')} className={`pn-var v1${variant==='v1'?' active':''}`}>V1</button>
          <button onClick={()=>setTweak('variant','v2')} className={`pn-var v2${variant==='v2'?' active':''}`}>V2</button>
        </div>
      </div>

      {/* Content */}
      {isAdmin ? (
        <PageAdmin />
      ) : (
        <>
          <SiteHeader variant={variant} page={page} setPage={setPage} />
          <main style={{ flex:1 }}>
            {page==='home'     && <PageHome variant={variant} />}
            {page==='category' && <PageCategory variant={variant} />}
            {page==='profile'  && <PageProfile variant={variant} setPage={setPage} />}
            {page==='item'     && <PageItem variant={variant} />}
            {page==='contact'  && <PageContact />}
            {page==='holistic' && <PageHolistic />}
          </main>
          <Footer />
        </>
      )}

      {/* Tweaks */}
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection title="וריאנט">
          <TweakRadio id="variant" label="גרסה" value={tweaks.variant} onChange={v=>setTweak('variant',v)} options={[{value:'v1',label:'V1 כהה'},{value:'v2',label:'V2 בהיר'}]} />
        </TweakSection>
        <TweakSection title="צבעים">
          <TweakColor id="primaryColor" label="Navy (ראשי)" value={tweaks.primaryColor} onChange={v=>setTweak('primaryColor',v)} />
          <TweakColor id="accentColor"  label="Yellow (הדגשה)" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
