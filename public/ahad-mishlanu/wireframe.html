<script type="text/babel">
const { useState, useEffect } = React;

/* ── primitives ── */
function Lines({ n=3, last=60, style={} }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:5, ...style }}>
      {Array.from({length:n}).map((_,i)=>(
        <div key={i} className="sk-line" style={{ width: i===n-1 ? `${last}%` : '100%' }} />
      ))}
    </div>
  );
}
function ImgPh({ w, h, text='📷', style={} }) {
  return (
    <div className="img-ph" style={{ width:w, height:h, flexShrink:0, ...style }}>
      <span>{text}</span>
    </div>
  );
}
function Logo({ small }) {
  const s = small ? .85 : 1;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:7*s, direction:'rtl' }}>
      <svg width={26*s} height={26*s} viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="10" r="7" fill="#f9e44a" stroke="#2a2a2a" strokeWidth="2.2"/>
        <line x1="9.5"  y1="16" x2="7"  y2="24" stroke="#2a2a2a" strokeWidth="2.2" strokeLinecap="round"/>
        <line x1="16.5" y1="16" x2="19" y2="24" stroke="#2a2a2a" strokeWidth="2.2" strokeLinecap="round"/>
      </svg>
      <div style={{ fontFamily:'Caveat', fontWeight:700, fontSize:14*s, lineHeight:1.15 }}>
        <div style={{ color:'#f9e44a' }}>אחד משלנו</div>
        <div style={{ color:'#cde', fontSize:11*s, fontWeight:400 }}>פורטל עסקי לקהילת השווים</div>
      </div>
    </div>
  );
}

/* ── Promo banner ticker ── */
function PromoBanner() {
  const items = [
    '🆕 הצטרפו 12 עסקים חדשים החודש!',
    '🏷️ מבצע שבוע הספר — 20% הנחה על ספרים ותוכן',
    '🤝 חברות חדשה: קייטרינג "טעמים מהבית" — ת"א',
    '⭐ מוצר מומלץ: הדרכות מקצועיות לארגונים',
    '🎉 500+ עסקים רשומים — הצטרפו גם אתם!',
  ];
  const [idx, setIdx] = useState(0);
  useEffect(()=>{
    const t = setInterval(()=> setIdx(p=>(p+1)%items.length), 2800);
    return ()=>clearInterval(t);
  },[]);
  return (
    <div style={{ background:'#f9e44a', borderBottom:'2px solid #c0a000', padding:'7px 16px',
                  display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
      <div style={{ fontFamily:'Caveat', fontWeight:700, fontSize:15, color:'#2a2a2a', flex:1 }}>
        {items[idx]}
      </div>
      <div style={{ display:'flex', gap:4 }}>
        {items.map((_,i)=>(
          <div key={i} onClick={()=>setIdx(i)} style={{
            width:8, height:8, borderRadius:'50%', cursor:'pointer',
            background: i===idx ? '#1b3f6e' : '#c0a000', border:'1px solid #c0a000'
          }}/>
        ))}
      </div>
      <button className="sk-btn sk-btn-primary" style={{ fontSize:12, padding:'3px 12px' }}>לכל המבצעים</button>
      <div className="note" style={{ position:'absolute', top:-16, right:0 }}>באנר פרומו מתחלף</div>
    </div>
  );
}

/* ══════════════════════════════════════

          }}>

            <div style={{ background:'#1b3f6e', padding:'8px 14px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:'2.5px solid #f9e44a' }}>

              </div>
              <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                <button className="sk-btn" style={{ fontSize:11, background:'transparent', color:'#fff', borderColor:'rgba(255,255,255,.4)', padding:'3px 10px' }}>
                  ← לדף המלא
                </button>
                <div style={{ fontFamily:'Caveat', fontSize:20, color:'#f9e44a', cursor:'pointer', lineHeight:1 }}>✕</div>
              </div>
            </div>

            Modal — נפתח מעל דף הבית / קטגוריה ללא ניווט
          </div>
        </div>
      )}
    </div>
  );
}
