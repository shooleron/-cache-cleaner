<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>העסק של כולנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;background:#fff;color:#111;direction:rtl}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:#FFD600;border-radius:3px}
  a,button{cursor:pointer;font-family:'Heebo',sans-serif}
  img{display:block;max-width:100%}
  input,textarea{font-family:'Heebo',sans-serif}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

// ── TOKENS ──────────────────────────────────────────────────────────
const Y   = '#FFD600';
const Y10 = 'rgba(255,214,0,0.10)';
const Y20 = 'rgba(255,214,0,0.20)';
const BK  = '#111111';
const WH  = '#FFFFFF';
const GR  = '#F6F6F6';
const GM  = '#E2E2E2';
const GD  = '#888';
const NV  = '#003466';

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#FFD600",
  "cardStyle": "shadowed",
  "fontSize": 16,
  "heroStyle": "dark"
}/*EDITMODE-END*/;

// ── RIBBON SVG ──────────────────────────────────────────────────────
const Ribbon = ({ size = 28, color = WH, style: s = {} }) => (
  <svg width={size} height={Math.round(size * 1.6)} viewBox="0 0 32 52"
    fill="none" xmlns="http://www.w3.org/2000/svg" style={s}>
    <path d="M16 3C9.4 3 4 8.1 4 14.5C4 20.1 8.3 24.8 14 26.4L10 49" stroke={color} strokeWidth="3.5" strokeLinecap="round"/>
    <path d="M16 3C22.6 3 28 8.1 28 14.5C28 20.1 23.7 24.8 18 26.4L22 49" stroke={color} strokeWidth="3.5" strokeLinecap="round"/>
    <path d="M16 3C9.4 3 4 8.1 4 14.5C4 20.9 9.4 26 16 26C22.6 26 28 20.9 28 14.5C28 8.1 22.6 3 16 3Z" fill={color}/>
  </svg>
);

// ── SEAL BADGE ──────────────────────────────────────────────────────
const Seal = ({ sm }) => (
  <span style={{
    display:'inline-flex', alignItems:'center', gap:5,
    background:Y, borderRadius:99, padding: sm ? '3px 10px' : '5px 14px',
    fontSize: sm ? 10 : 11, fontWeight:800, color:BK,
    letterSpacing:'0.5px', whiteSpace:'nowrap',
  }}>✓ THE ONE OF US SEAL</span>
);

// ── BTN ─────────────────────────────────────────────────────────────
const Btn = ({ children, variant='primary', onClick, full, sm }) => {
  const [hov,setHov] = useState(false);
  const base = {
    display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
    border:'none', cursor:'pointer', fontFamily:'Heebo', fontWeight:800,
    borderRadius:6, transition:'all .15s', width: full ? '100%' : undefined,
    padding: sm ? '9px 18px' : '13px 28px',
    fontSize: sm ? 14 : 16,
  };
  const styles = {
    primary:  { background: hov ? '#e8c200' : Y, color: BK },
    dark:     { background: hov ? '#333' : BK, color: WH },
    outline:  { background:'transparent', color: BK, border:`2px solid ${hov ? BK : GM}` },
    ghost:    { background:'transparent', color: hov ? Y : WH, border:`2px solid ${hov ? Y : 'rgba(255,255,255,.3)'}` },
  };
  return (
    <button style={{...base,...styles[variant]}} onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      {children}
    </button>
  );
};

// ── NAV ─────────────────────────────────────────────────────────────
const Nav = ({ page, nav }) => {
  const links = [
    {l:'מוצרים נבחרים', p:'home'},
    {l:'אנשי מקצוע', p:'home'},
    {l:'שירותים נוספים', p:'home'},
    {l:'הסיפורים מאחורי', p:'home'},
    {l:'צור קשר', p:'contact'},
  ];
  return (
    <nav style={{
      position:'sticky', top:0, zIndex:200, background:BK,
      borderBottom:`3px solid ${Y}`, padding:'0 64px', height:64,
      display:'flex', alignItems:'center', gap:0,
    }}>
      {/* Social */}
      <div style={{display:'flex',gap:10}}>
        {['IG','FB'].map(s=>(
          <div key={s} style={{width:32,height:32,borderRadius:'50%',border:'1px solid rgba(255,255,255,.25)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{color:WH,fontSize:10,fontWeight:700}}>{s}</span>
          </div>
        ))}
      </div>
      {/* Links */}
      <div style={{display:'flex',gap:32,flex:1,justifyContent:'center'}}>
        {links.map(({l,p})=>(
          <a key={l} onClick={()=>nav(p)} style={{
            color: page===p && l==='מוצרים נבחרים' ? Y : 'rgba(255,255,255,.8)',
            fontSize:14, fontWeight:500, textDecoration:'none', cursor:'pointer',
            transition:'color .15s',
          }}
          onMouseEnter={e=>e.target.style.color=Y}
          onMouseLeave={e=>e.target.style.color='rgba(255,255,255,.8)'}>{l}</a>
        ))}
      </div>
      {/* Logo */}
      <div onClick={()=>nav('home')} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',flexShrink:0}}>
        <Ribbon size={20} color={Y}/>
        <span style={{color:WH,fontSize:20,fontWeight:900,letterSpacing:'-0.5px',whiteSpace:'nowrap'}}>מחזקים את משפחות החטופים</span>
      </div>
    </nav>
  );
};

// ── FOOTER ──────────────────────────────────────────────────────────
const Footer = ({ nav }) => (
  <footer style={{background:BK,padding:'56px 80px 36px',color:WH}}>
    <div style={{display:'flex',gap:80,marginBottom:48,flexWrap:'wrap'}}>
      <div style={{minWidth:240}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
          <Ribbon size={24} color={Y}/>
          <span style={{fontSize:20,fontWeight:900}}>העסק של כולנו</span>
        </div>
        <p style={{fontSize:14,color:'rgba(255,255,255,.55)',lineHeight:1.8,maxWidth:220}}>
          מחזקים את הבית, תומכים בעסקי משפחות השבים.
        </p>
      </div>
      {[
        {title:'ניווט', links:['בית','קהילת העסקים','צור קשר']},
        {title:'מידע', links:['הצהרת נגישות','תנאי שימוש','מדיניות פרטיות']},
      ].map(col=>(
        <div key={col.title}>
          <p style={{fontSize:11,fontWeight:800,color:Y,letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:18}}>{col.title}</p>
          {col.links.map(l=>(
            <p key={l} onClick={()=>l==='צור קשר'&&nav('contact')} style={{fontSize:15,color:'rgba(255,255,255,.6)',marginBottom:10,cursor:'pointer'}}>{l}</p>
          ))}
        </div>
      ))}
    </div>
    <div style={{borderTop:'1px solid rgba(255,255,255,.1)',paddingTop:24,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span style={{fontSize:13,color:'rgba(255,255,255,.3)'}}>© 2024 העסק של כולנו. כל הזכויות שמורות.</span>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <Ribbon size={14} color={Y}/>
        <span style={{fontSize:13,color:Y,fontWeight:700}}>#מחזקים_את_הבית</span>
      </div>
    </div>
  </footer>
);

// ── SECTION HEADER ───────────────────────────────────────────────────
const SecHead = ({ title, sub, link, onLink }) => (
  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:32}}>
    <div>
      <h2 style={{fontSize:26,fontWeight:900,color:BK,letterSpacing:'-0.5px',marginBottom:sub?6:0}}>{title}</h2>
      {sub&&<p style={{fontSize:14,color:GD}}>{sub}</p>}
    </div>
    {link&&<a onClick={onLink} style={{fontSize:14,fontWeight:700,color:NV,cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
      {link} ←
    </a>}
  </div>
);

// ── PRODUCT CARD ─────────────────────────────────────────────────────
const PCard = ({ name, cat, price, desc, seal, img, onClick }) => {
  const [hov,setHov]=useState(false);
  return (
    <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        background:WH, border:`2px solid ${hov?Y:GM}`, borderRadius:8,
        overflow:'hidden', cursor:'pointer',
        boxShadow: hov ? `0 8px 28px rgba(255,214,0,.18)` : '0 1px 4px rgba(0,0,0,.06)',
        transform: hov ? 'translateY(-3px)' : 'none',
        transition:'all .15s',
      }}>
      <div style={{height:168,background:`${GR} ${img?`url(${img}) center/cover no-repeat`:''}`,position:'relative'}}>
        {seal&&<div style={{position:'absolute',top:10,right:10}}><Seal sm/></div>}
        {!img&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',opacity:.3}}>
          <Ribbon size={52} color={BK}/>
        </div>}
      </div>
      <div style={{padding:'16px 18px 20px'}}>
        {cat&&<span style={{display:'inline-block',background:hov?Y:'#f5f0c0',color:BK,fontSize:11,fontWeight:800,borderRadius:4,padding:'2px 8px',marginBottom:8,letterSpacing:.3}}>{cat}</span>}
        <h3 style={{fontSize:15,fontWeight:800,color:BK,marginBottom:6,lineHeight:1.3}}>{name}</h3>
        {desc&&<p style={{fontSize:13,color:GD,lineHeight:1.6,marginBottom:12}}>{desc}</p>}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'auto'}}>
          {price&&<span style={{fontSize:16,fontWeight:800,color:NV}}>{price}</span>}
          <Btn variant="dark" sm>לרכישה →</Btn>
        </div>
      </div>
    </div>
  );
};

// ── SERVICE CARD ─────────────────────────────────────────────────────
const SCard = ({ icon, title, desc, cta }) => {
  const [hov,setHov]=useState(false);
  return (
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        background:hov?BK:GR, border:`2px solid ${hov?Y:GM}`,
        borderRadius:8, padding:'32px 28px',
        transition:'all .2s', cursor:'pointer',
      }}>
      <div style={{fontSize:32,marginBottom:16}}>{icon}</div>
      <h3 style={{fontSize:18,fontWeight:800,color:hov?WH:BK,marginBottom:10}}>{title}</h3>
      <p style={{fontSize:14,color:hov?'rgba(255,255,255,.65)':GD,lineHeight:1.8,marginBottom:24}}>{desc}</p>
      <span style={{
        display:'inline-flex',alignItems:'center',gap:6,
        fontSize:14,fontWeight:700,color:hov?Y:BK,
        borderBottom:`2px solid ${hov?Y:BK}`,paddingBottom:2,
      }}>{cta} +</span>
    </div>
  );
};

// ── CATEGORY CHIPS ───────────────────────────────────────────────────
const CATS = ['הכל','אוכל ואירוח','עיצוב ואמנות','שירותים מקצועיים','בריאות ורווחה','חינוך','אופנה','טכנולוגיה'];
const Chips = ({ active, set }) => (
  <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}}>
    {CATS.map(c=>(
      <button key={c} onClick={()=>set(c)} style={{
        background: active===c ? Y : WH,
        border:`2px solid ${active===c ? Y : GM}`,
        color: active===c ? BK : '#555',
        fontSize:13, fontWeight: active===c ? 800 : 500,
        padding:'7px 18px', borderRadius:99, whiteSpace:'nowrap',
        transition:'all .15s', cursor:'pointer',
      }}>{c}</button>
    ))}
  </div>
);

// ══════════════════════════════════════════════════════════════════════
// HOME PAGE
// ══════════════════════════════════════════════════════════════════════
const HomePage = ({ nav }) => {
  const [cat,setCat]=useState('הכל');
  const [q,setQ]=useState('');

  const products = [
    { name:'מארז ניצחון של עומר ונקרט', cat:'יין ואלכוהול', price:'החל מ-₪1,200', desc:'מארז 6 בקבוקים מהדורה מוגבלת', seal:true },
    { name:'שיפוד נקי "בביתא"', cat:'אוכל ואירוח', price:'החל מ-₪85', desc:'ארוחה ביתית טעימה ומוכנה עם אהבה', seal:false },
    { name:'קולקציית חוסן — כד קרמי', cat:'עיצוב ואמנות', price:'החל מ-₪320', desc:'קרמיקה בעבודת יד, מהדורה מוגבלת', seal:true },
    { name:'קפה הניצחון', cat:'אוכל ואירוח', price:'החל מ-₪45', desc:'תערובת קפה מיוחדת מהדורה מוגבלת', seal:false },
  ];

  const services = [
    { icon:'⚖️', title:'ייעוץ אסטרטגי לעסקים', desc:'תמיכה מקצועית לעסקים המחפשים כיוון וצמיחה — מאנשים שמבינים את הסיפור.', cta:'לפרטים נוספים' },
    { icon:'🎨', title:'מיתוג ועיצוב גרפי', desc:'שירותי מיתוג מלאים, מתוך הבנה אמיתית של מי אתם ולאן אתם הולכים.', cta:'לפרטים נוספים' },
    { icon:'📣', title:'שיווק וקידום ממוקד', desc:'קמפיינים שיוציאו את העסק שלכם לאור ויגיעו ללקוחות הנכונים.', cta:'לפרטים נוספים' },
  ];

  return (
    <div>
      {/* ── HERO ── */}
      <section style={{background:BK,padding:'72px 80px 64px',position:'relative',overflow:'hidden'}}>
        {/* BG ribbon watermark */}
        <div style={{position:'absolute',left:-40,top:'50%',transform:'translateY(-50%)',opacity:.04,pointerEvents:'none'}}>
          <Ribbon size={380} color={WH}/>
        </div>
        <div style={{position:'absolute',left:640,top:0,bottom:0,right:0,opacity:.06,overflow:'hidden',pointerEvents:'none'}}>
          <div style={{position:'absolute',right:-80,top:'50%',transform:'translateY(-50%)'}}>
            <Ribbon size={460} color={WH}/>
          </div>
        </div>

        <div style={{maxWidth:720,position:'relative'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:22}}>
            <Ribbon size={16} color={Y}/>
            <span style={{fontSize:12,fontWeight:800,color:Y,letterSpacing:'1.5px',textTransform:'uppercase'}}>מחזקים את הבית</span>
          </div>
          <h1 style={{fontSize:60,fontWeight:900,color:WH,lineHeight:1.05,letterSpacing:'-1.5px',marginBottom:22}}>
            הקהילה העסקית<br/>
            <span style={{color:Y}}>של משפחות החטופים</span>
          </h1>
          <p style={{fontSize:18,color:'rgba(255,255,255,.6)',lineHeight:1.75,maxWidth:560,marginBottom:40}}>
            פלטפורמה שמחברת בין עסקים של משפחות החטופים לבין קהילה תומכת — כי הכוח שלנו הוא ביחד.
          </p>
          {/* Search */}
          <div style={{display:'flex',maxWidth:600,border:`3px solid ${Y}`,borderRadius:8,overflow:'hidden'}}>
            <input value={q} onChange={e=>setQ(e.target.value)}
              placeholder="חפשו מוצר, שירות, עסק..."
              style={{flex:1,padding:'14px 20px',fontSize:16,border:'none',outline:'none',fontFamily:'Heebo',direction:'rtl',color:BK,background:WH}}
            />
            <button style={{background:Y,color:BK,fontSize:16,fontWeight:800,padding:'14px 28px',border:'none',cursor:'pointer',flexShrink:0}}>
              חיפוש
            </button>
          </div>
        </div>
      </section>

      {/* ── CATEGORIES ── */}
      <section style={{background:GR,borderBottom:`1px solid ${GM}`,padding:'18px 80px'}}>
        <Chips active={cat} set={setCat}/>
      </section>

      {/* ── FEATURED PRODUCTS ── */}
      <section style={{padding:'64px 80px'}}>
        <SecHead title="מוצרים נבחרים" sub="נבחרו בקפידה מבין עסקי הקהילה שלנו" link="כל המוצרים"/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:24}}>
          {products.map((p,i)=>(
            <PCard key={i} {...p} onClick={()=>nav('profile')}/>
          ))}
        </div>
      </section>

      {/* ── DIGITAL SERVICES ── */}
      <section style={{padding:'64px 80px',background:GR,borderTop:`1px solid ${GM}`,borderBottom:`1px solid ${GM}`}}>
        <SecHead title="שירותים דיגיטליים" sub="שירותים מקצועיים מהקהילה לקהילה" link="לכל השירותים"/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24}}>
          {services.map((s,i)=><SCard key={i} {...s}/>)}
        </div>
      </section>

      {/* ── SEAL SECTION ── */}
      <section style={{background:Y,padding:'80px 80px',display:'flex',gap:80,alignItems:'center'}}>
        <div style={{flex:1}}>
          <p style={{fontSize:11,fontWeight:800,letterSpacing:'1.5px',textTransform:'uppercase',color:'rgba(0,0,0,.45)',marginBottom:16}}>THE ONE OF US SEAL</p>
          <h2 style={{fontSize:44,fontWeight:900,color:BK,lineHeight:1.05,letterSpacing:'-1px',marginBottom:20}}>
            חותם של איכות<br/>וסולידריות
          </h2>
          <p style={{fontSize:16,color:'rgba(0,0,0,.65)',lineHeight:1.85,maxWidth:480,marginBottom:36}}>
            כל עסק בפלטפורמה עובר אימות ובדיקה. אנחנו מבטיחים שהחיבורים בפלטפורמה אמינים ואיכותיים של ממש — כי מאחורי כל עסק עומד סיפור אמיתי.
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {['עסקים מאומתים ובדוקים','תמיכה מקצועית מקצה לקצה','ליווי ושיתוף פעולה עם הקהילה'].map(item=>(
              <div key={item} style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:24,height:24,background:BK,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <span style={{color:Y,fontSize:12,fontWeight:900}}>✓</span>
                </div>
                <span style={{fontSize:16,fontWeight:600,color:BK}}>{item}</span>
              </div>
            ))}
          </div>
          <div style={{marginTop:36}}>
            <Btn variant="dark" onClick={()=>nav('profile')}>לפרופיל עסק לדוגמה ←</Btn>
          </div>
        </div>
        {/* Seal box */}
        <div style={{
          width:260,height:260,background:BK,borderRadius:16,flexShrink:0,
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,
          boxShadow:'0 24px 48px rgba(0,0,0,.35)',
        }}>
          <Ribbon size={72} color={Y}/>
          <span style={{color:WH,fontSize:12,fontWeight:800,letterSpacing:'1px',textTransform:'uppercase',textAlign:'center',lineHeight:1.6}}>
            THE ONE OF US<br/>SEAL
          </span>
        </div>
      </section>

      {/* ── B2B BANNER ── */}
      <section style={{background:NV,padding:'72px 80px',display:'flex',gap:64,alignItems:'center',overflow:'hidden',position:'relative'}}>
        <div style={{position:'absolute',left:-60,top:'50%',transform:'translateY(-50%)',opacity:.07}}>
          <Ribbon size={340} color={WH}/>
        </div>
        <div style={{flex:1,position:'relative'}}>
          <p style={{fontSize:11,fontWeight:800,color:Y,letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:14}}>לעסקים ואירגונים</p>
          <h2 style={{fontSize:38,fontWeight:900,color:WH,lineHeight:1.15,marginBottom:18,letterSpacing:'-0.5px'}}>
            פתרונות הוליסטיים<br/>לעסקים ואירגונים
          </h2>
          <p style={{fontSize:15,color:'rgba(255,255,255,.65)',lineHeight:1.85,maxWidth:460,marginBottom:36}}>
            מנגנוני רוחות, רכש ומשאבי אנוש — אנחנו מציעים פלטפורמה מרחבת לרכישה: מתנות חג, שירותי ייעוץ, סדנאות גיבוש והרצאות מעוררות השראה. הכל מעסקים של אחד מאיתנו.
          </p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 32px',maxWidth:380,marginBottom:36}}>
            {['מארזי שי ומתנות','שירותי גיבוש','הרצאות וסדנאות','כיבוד ואירוח'].map(item=>(

const TweaksPanel = ({ tweaks, setTweak, visible, onClose }) => {

  const ref=useRef();

  useEffect(()=>{

    });
  },[]);

  if(!visible) return null;
  const colors = [{l:'צהוב קלאסי',v:'#FFD600'},{l:'כתום חיוני',v:'#FF8C00'},{l:'ירוק תקווה',v:'#4CAF50'},{l:'כחול ים',v:'#0078D4'}];
  return (
    <div ref={ref} style={{
      position:'fixed', left:pos.x, top:pos.y, zIndex:9999,
      background:WH, border:`2px solid ${BK}`, borderRadius:10,
      boxShadow:'0 12px 40px rgba(0,0,0,.18)', width:240, userSelect:'none',
    }}>
      <div onMouseDown={e=>{setDrag({x:e.clientX,y:e.clientY,ox:pos.x,oy:pos.y})}}
        style={{background:BK,color:WH,padding:'10px 14px',borderRadius:'8px 8px 0 0',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'grab'}}>
        <span style={{fontSize:13,fontWeight:800,letterSpacing:'0.5px'}}>⚙ Tweaks</span>
        <button onClick={()=>{onClose(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*')}} style={{background:'none',border:'none',color:WH,fontSize:16,cursor:'pointer',lineHeight:1}}>×</button>
      </div>
      <div style={{padding:16}}>
        <p style={{fontSize:11,fontWeight:800,color:GD,letterSpacing:'1px',textTransform:'uppercase',marginBottom:10}}>צבע מבטא</p>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
          {colors.map(c=>(
            <div key={c.v} onClick={()=>setTweak('accentColor',c.v)} title={c.l}
              style={{width:30,height:30,borderRadius:'50%',background:c.v,cursor:'pointer',border:`3px solid ${tweaks.accentColor===c.v?BK:'transparent'}`,transition:'border .1s'}}/>

        </div>

// APP
// ══════════════════════════════════════════════════════════════════════
const App = () => {
  const [page,setPage]=useState('home');
  const [tweaks,setTweaksState]=useState(TWEAK_DEFAULTS);
  const [tweaksOpen,setTweaksOpen]=useState(false);

  const setTweak=(k,v)=>{
    const next={...tweaks,[k]:v};
    setTweaksState(next);
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:next},'*');
  };

  useEffect(()=>{
    window.scrollTo({top:0,behavior:'auto'});
  },[page]);

  useEffect(()=>{
    const handler=e=>{
      if(e.data?.type==='__activate_edit_mode') setTweaksOpen(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',handler);
  },[]);

  const nav=(p)=>setPage(p);

  return (
    <div>
      <Nav page={page} nav={nav}/>
      {page==='home' && <HomePage nav={nav}/>}
      {page==='profile' && <ProfilePage nav={nav}/>}
      {page==='contact' && <ContactPage/>}
      <Footer nav={nav}/>
      <TweaksPanel tweaks={tweaks} setTweak={setTweak} visible={tweaksOpen} onClose={setTweaksOpen}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
