<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function Lines({ n=3, last=60, style={} }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:3, ...style }}>
      {Array.from({length:n}).map((_,i)=>(
        <div key={i} className="sk-line" style={{ width: i===n-1?`${last}%`:'100%' }} />
      ))}
    </div>
  );
}
function ImgPh({ w, h, text='📷', style={} }) {
  return (
    <div className="img-ph" style={{ width:w, height:h, flexShrink:0, ...style }}>
      <span>{text}</span>
    </div>
  );
}
function Logo({ small }) {
  const s = small ? .8 : 1;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:6*s }}>
      <svg width={22*s} height={22*s} viewBox="0 0 26 26" fill="none">

        <div style={{ color:'#b8d0ee', fontSize:9*s, fontWeight:400 }}>פורטל עסקי לקהילת השווים</div>
      </div>
    </div>
  );
}
